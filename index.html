<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Social Hub & QR Generator</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.65rem 0.75rem 0.65rem 2.5rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea {
      padding-left: 0.75rem;
      resize: vertical;
      min-height: 60px;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover {
      background: #475569;
    }

    /* Preview Mockup */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-mockup {
      width: 100%;
      max-width: 320px;
      background: #0b1120;
      border: 6px solid #334155;
      border-radius: 36px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 480px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      color: #fff;
      margin-bottom: 0.75rem;
    }

    .preview-name {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }

    .preview-bio {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: transform 0.15s, background 0.15s;
    }

    .link-item:hover {
      transform: translateY(-2px);
      background: #334155;
    }

    .link-item i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    /* QR Code Display Area */
    .qr-section {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #qrcode {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="panel">
      <h2><i class="fa-solid fa-sliders"></i> Company Info</h2>
      
      <div class="form-group">
        <label>Company / Brand Name</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-building"></i>
          <input type="text" id="in-name" value="Acme Enterprise" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>Tagline / Description</label>
        <textarea id="in-bio" oninput="updatePreview()">Connecting you to world-class digital solutions.</textarea>
      </div>

      <div class="form-group">
        <label>Official Website</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-globe"></i>
          <input type="url" id="in-website" value="https://example.com" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>LinkedIn URL</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-linkedin text-blue-500"></i>
          <input type="url" id="in-linkedin" value="https://linkedin.com/company/example" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>Instagram URL</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-instagram"></i>
          <input type="url" id="in-instagram" value="https://instagram.com/example" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>TikTok URL</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-tiktok"></i>
          <input type="url" id="in-tiktok" value="https://tiktok.com/@example" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>Facebook URL</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-facebook"></i>
          <input type="url" id="in-facebook" value="https://facebook.com/example" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group">
        <label>Twitter / X URL</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-x-twitter"></i>
          <input type="url" id="in-twitter" value="https://twitter.com/example" oninput="updatePreview()" />
        </div>
      </div>

      <div class="form-group" style="margin-top: 1.5rem;">
        <label>Hosted Landing Page URL (What the QR encodes)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-link"></i>
          <input type="url" id="in-target-url" value="https://github.com/MohamedBatal/ACA_QR" oninput="generateQR()" />
        </div>
      </div>

      <button class="btn btn-secondary" onclick="exportLandingPageHTML()">
        <i class="fa-solid fa-file-code"></i> Download Standalone Landing Page
      </button>
    </div>

    <div class="panel preview-container">
      <h2><i class="fa-solid fa-mobile-screen"></i> Scan Result Preview</h2>
      
      <div class="phone-mockup">
        <div class="avatar" id="pv-avatar"><i class="fa-solid fa-briefcase"></i></div>
        <div class="preview-name" id="pv-name">Acme Enterprise</div>
        <div class="preview-bio" id="pv-bio">Connecting you to world-class digital solutions.</div>

        <div class="links-list" id="pv-links">
          </div>
      </div>

      <div class="qr-section">
        <h2><i class="fa-solid fa-qrcode"></i> Generated QR Code</h2>
        <div id="qrcode"></div>
        <button class="btn" onclick="downloadQRCode()">
          <i class="fa-solid fa-download"></i> Download QR Code (PNG)
        </button>
      </div>
    </div>
  </div>

  <script>
    let qrcodeObj = null;

    function getFormData() {
      return {
        name: document.getElementById('in-name').value || 'Your Company',
        bio: document.getElementById('in-bio').value || '',
        website: document.getElementById('in-website').value,
        linkedin: document.getElementById('in-linkedin').value,
        instagram: document.getElementById('in-instagram').value,
        tiktok: document.getElementById('in-tiktok').value,
        facebook: document.getElementById('in-facebook').value,
        twitter: document.getElementById('in-twitter').value,
        targetUrl: document.getElementById('in-target-url').value
      };
    }

    function updatePreview() {
      const data = getFormData();
      document.getElementById('pv-name').innerText = data.name;
      document.getElementById('pv-bio').innerText = data.bio;

      const linksContainer = document.getElementById('pv-links');
      linksContainer.innerHTML = '';

      const platforms = [
        { label: 'Official Website', url: data.website, icon: 'fa-solid fa-globe', color: '#38bdf8' },
        { label: 'LinkedIn', url: data.linkedin, icon: 'fa-brands fa-linkedin', color: '#0a66c2' },
        { label: 'Instagram', url: data.instagram, icon: 'fa-brands fa-instagram', color: '#e1306c' },
        { label: 'TikTok', url: data.tiktok, icon: 'fa-brands fa-tiktok', color: '#ffffff' },
        { label: 'Facebook', url: data.facebook, icon: 'fa-brands fa-facebook', color: '#1877f2' },
        { label: 'Twitter / X', url: data.twitter, icon: 'fa-brands fa-x-twitter', color: '#ffffff' }
      ];

      platforms.forEach(p => {
        if (p.url.trim()) {
          const a = document.createElement('a');
          a.className = 'link-item';
          a.href = p.url;
          a.target = '_blank';
          a.innerHTML = `<i class="${p.icon}" style="color: ${p.color}"></i><span>${p.label}</span>`;
          linksContainer.appendChild(a);
        }
      });
    }

    function generateQR() {
      const targetUrl = document.getElementById('in-target-url').value || 'https://example.com';
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      qrcodeObj = new QRCode(qrContainer, {
        text: targetUrl,
        width: 180,
        height: 180,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQRCode() {
      const img = document.querySelector('#qrcode img');
      if (img && img.src) {
        const link = document.createElement('a');
        link.download = 'company-qrcode.png';
        link.href = img.src;
        link.click();
      }
    }

    function exportLandingPageHTML() {
      const data = getFormData();
      const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${data.name} - Official Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; padding: 2rem 1rem; }
    .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    .avatar { width: 75px; height: 75px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
    p { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }
    .link-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1.25rem; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600; }
    .link-item:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"><i class="fa-solid fa-briefcase"></i></div>
    <h1>${data.name}</h1>
    <p>${data.bio}</p>
    <div class="links">
      ${data.website ? `<a class="link-item" href="${data.website}"><i class="fa-solid fa-globe" style="color:#38bdf8"></i> Official Website</a>` : ''}
      ${data.linkedin ? `<a class="link-item" href="${data.linkedin}"><i class="fa-brands fa-linkedin" style="color:#0a66c2"></i> LinkedIn</a>` : ''}
      ${data.instagram ? `<a class="link-item" href="${data.instagram}"><i class="fa-brands fa-instagram" style="color:#e1306c"></i> Instagram</a>` : ''}
      ${data.tiktok ? `<a class="link-item" href="${data.tiktok}"><i class="fa-brands fa-tiktok"></i> TikTok</a>` : ''}
      ${data.facebook ? `<a class="link-item" href="${data.facebook}"><i class="fa-brands fa-facebook" style="color:#1877f2"></i> Facebook</a>` : ''}
      ${data.twitter ? `<a class="link-item" href="${data.twitter}"><i class="fa-brands fa-x-twitter"></i> Twitter / X</a>` : ''}
    </div>
  </div>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'company-links.html';
      a.click();
    }

    // Initialize
    updatePreview();
    generateQR();
  </script>
</body>
</html>
